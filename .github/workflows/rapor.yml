{"name": "BIST Rapor", "on": {"schedule": [{"cron": "10 7 * * 1-5"}, {"cron": "45 7 * * 1-5"}, {"cron": "30 11 * * 1-5"}, {"cron": "20 13 * * 1-5"}, {"cron": "30 15 * * 1-5"}], "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "concurrency": {"group": "rapor", "cancel-in-progress": false}, "jobs": {"rapor": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-python@v5", "with": {"python-version": "3.11"}}, {"run": "pip install -r requirements-rapor.txt"}, {"run": "python report.py", "env": {"GMAIL_USER": "${{ secrets.GMAIL_USER }}", "GMAIL_APP_PASSWORD": "${{ secrets.GMAIL_APP_PASSWORD }}", "MAIL_TO": "${{ secrets.MAIL_TO }}", "TELEGRAM_BOT_TOKEN": "${{ secrets.TELEGRAM_BOT_TOKEN }}", "TELEGRAM_CHAT_ID": "${{ secrets.TELEGRAM_CHAT_ID }}"}}, {"name": "Kayıtları sakla", "if": "always()", "run": "git config user.name bist-bot\ngit config user.email bist-bot@users.noreply.github.com\ngit add log || true\nif ! git diff --cached --quiet; then git commit -m 'aday kaydi' && git pull --rebase && git push; fi"}]}}}
